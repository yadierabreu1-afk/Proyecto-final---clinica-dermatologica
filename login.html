<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.dataset.theme=localStorage.getItem("derma_tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script><title>Iniciar sesión · Clínica Dermis</title></head>
<body class="login-page">
<main class="login">
  <section class="login-art" aria-hidden="true">
    <div class="rueda"></div>
    <p class="lema">Seis fototipos, una sola clínica que mira cada piel por separado.</p>
  </section>
  <section class="login-form">
    <form id="form" class="login-card">
      <div class="marca"><span class="logo"></span>Clínica Dermis</div>
      <h2>Inicia sesión</h2>
      <p class="muted">Accede con tu cuenta del personal.</p>
      <div class="field"><label for="email">Correo</label>
        <input id="email" name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="password">Contraseña</label>
        <div class="pass"><input id="password" name="password" type="password" required autocomplete="current-password">
        <button type="button" id="ver" class="btn ghost sm">Mostrar</button></div></div>
      <p id="error" class="error" role="alert"></p>
      <button class="btn primary block" id="btn">Iniciar sesión</button>
      <div class="demo"><small>Cuentas de demostración</small>
        <div>
          <button type="button" data-u="admin@clinica.com" data-p="Admin123*">Administrador</button>
          <button type="button" data-u="dra.martinez@clinica.com" data-p="Derma123*">Dermatóloga</button>
          <button type="button" data-u="recepcion@clinica.com" data-p="Recep123*">Recepción</button>
        </div></div>
    </form>
  </section>
</main>
<script type="module" src="js/login.js"></script>
</body></html>
